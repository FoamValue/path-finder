name: PR completeness check

# 完备性门禁（分层阻断）：
# Layer 1 双语文档配对 → 仅警告，不吓退偶发贡献者
# Layer 2 发版 PR（chore(main): release x.y.z）版本文件卫生 → 硬阻断
on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: read

jobs:
  completeness:                # job id 即 required check context 名
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: bash .github/scripts/pr-completeness.sh
