name: release-please

# main 上累积 conventional commits，自动维护发版 PR（chore(main): release x.y.z）。
# 合并发版 PR → 自动 tag + GitHub Release（生产发布点）。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # 必须用 PAT（用户身份）创建发版 PR：GITHUB_TOKEN 创建的 PR 不会触发 CI（防递归机制），
          # 导致发版 PR 永久 BLOCKED 在 required checks 上。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
