version: 2
updates:
  # 后端 Maven 依赖：只放开 minor/patch，major 需人工评估
  - package-ecosystem: "maven"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: [ "dependencies" ]
    commit-message:
      prefix: "build"
    allow:
      - dependency-type: "production"
        update-types: [ "version-update:semver-minor", "version-update:semver-patch" ]
      - dependency-type: "development"
        update-types: [ "version-update:semver-minor", "version-update:semver-patch" ]
    cooldown:                      # 供应链投毒冷却期：新版本发布后先观察
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 1
    groups:                        # 分组合并，减少 PR 数量
      spring:
        patterns: [ "org.springframework:*", "org.springframework.boot:*" ]

  # 前端 npm 依赖
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: [ "dependencies" ]
    commit-message:
      prefix: "build"
    allow:
      - dependency-type: "production"
        update-types: [ "version-update:semver-minor", "version-update:semver-patch" ]
      - dependency-type: "development"
        update-types: [ "version-update:semver-minor", "version-update:semver-patch" ]
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 1
    groups:
      dev-deps:
        dependency-type: "development"
        patterns: [ "*" ]

  # CI Actions 自身更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    cooldown:
      default-days: 3
    groups:
      all-actions:
        patterns: [ "*" ]
