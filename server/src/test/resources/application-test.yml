spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:pathfinder_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:pathfinder}
    password: ${MYSQL_PASSWORD:pathfinder123}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

pathfinder:
  storage:
    root: ./target/test-storage

upload-file:
  storage-dir: ./target/test-storage/upload
  metadata-store: memory
  verify-checksum: false
  async-merge:
    enabled: true
    thread-pool-size: 2
