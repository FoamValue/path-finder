spring:
  application:
    name: pathfinder-server
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:pathfinder}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:pathfinder}
    password: ${MYSQL_PASSWORD:pathfinder123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8

pathfinder:
  storage:
    root: ${STORAGE_ROOT:./data/storage}
  security:
    # RSA 私钥文件路径（可选，为空则启动时生成并写入 storage.root）
    private-key-path: ${RSA_PRIVATE_KEY_PATH:}
    session-timeout: 30m
    login-max-fail: 5
    login-lock-minutes: 10
    # 验证码开关（仅测试环境置 false，生产必须保持 true）
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    # 空库 Seed 时给首个 admin 使用的固定密码（配置后不强制改密）；默认用 Init@123 并强制改密
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  sync:
    enabled: ${SYNC_ENABLED:true}
    watch-dir: ${SYNC_WATCH_DIR:./data/import}
    interval: ${SYNC_INTERVAL:5m}
    skip-recent-seconds: ${SYNC_SKIP_RECENT_SECONDS:30}
    dedup-by-md5: ${SYNC_DEDUP_BY_MD5:true}

upload-file:
  storage-dir: ${STORAGE_ROOT:./data/storage}/upload
  metadata-store: redis
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    key-prefix: "upload:task:"
    ttl-seconds: 86400
  verify-checksum: true
  max-chunk-size: 5242880
  max-file-size: 524288000
  max-request-size: 10485760
  quota:
    max-bytes: ${UPLOAD_QUOTA_MAX_BYTES:0}   # 0 = 关闭；组件全局容量配额，超限返回 507（保守估算：进行中声明大小 + 已合并产物）
  async-merge:
    enabled: true
    thread-pool-size: 2
  cleanup:
    enabled: true        # 组件 StorageCleanupService 开关（core 手工装配由 PathFinder 接线，见 UploadFileConfig）
    run-on-startup: true
    interval: 1h
    task-ttl: 24h        # 未完成任务闲置 TTL（与 redis.ttl-seconds 一致）
    orphan-enabled: true # 无任务记录的孤儿分片/合并目录回收
    use-redis-lock: true # 保留键：单实例部署不使用（多实例需接线 RedisCleanupLock）
  security:
    enabled: false

logging:
  level:
    root: info
    cn.chenxinjie.pathfinder: info
