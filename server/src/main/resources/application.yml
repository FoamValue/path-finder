spring:
  application:
    name: pathfinder-server
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:pathfinder}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:pathfinder}
    password: ${MYSQL_PASSWORD:pathfinder123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8

pathfinder:
  storage:
    root: ${STORAGE_ROOT:./data/storage}
  security:
    # RSA 私钥文件路径（可选，为空则启动时生成并写入 storage.root）
    private-key-path: ${RSA_PRIVATE_KEY_PATH:}
    session-timeout: 30m
    login-max-fail: 5
    login-lock-minutes: 10
    # CORS 显式白名单（禁止通配 + 凭据）；生产用路径形式变量覆盖
    cors-allowed-origins: ${PATHFINDER_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8000}
    # 仅当部署在受信反向代理后置 true，才会读取 X-Forwarded-For 作为审计 IP
    trust-proxy-header: ${PATHFINDER_SECURITY_TRUST_PROXY_HEADER:false}
    # 验证码开关（仅测试环境置 false，生产必须保持 true）
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    # 空库 Seed 时给首个 admin 使用的固定密码（配置后不强制改密）；默认用 Init@123 并强制改密
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  sync:
    enabled: ${SYNC_ENABLED:true}
    watch-dir: ${SYNC_WATCH_DIR:./data/import}
    interval: ${SYNC_INTERVAL:5m}
    skip-recent-seconds: ${SYNC_SKIP_RECENT_SECONDS:30}
    dedup-by-md5: ${SYNC_DEDUP_BY_MD5:true}

upload-file:
  storage-dir: ${STORAGE_ROOT:./data/storage}/upload
  metadata-store: redis
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    key-prefix: "upload:task:"
    ttl-seconds: 86400
  verify-checksum: true
  # rc.9 安全收口：verify-checksum=true 时必须一并开启 require-checksum，缺失 chunkMd5 的分块
  # 将被拒绝并删除，而不再静默跳过校验（前端每个分片均附带 chunkMd5，开启无副作用）。
  require-checksum: true
  max-chunk-size: 5242880
  max-file-size: 524288000
  max-request-size: 10485760
  quota:
    max-bytes: ${UPLOAD_QUOTA_MAX_BYTES:0}   # 0 = 关闭；组件全局容量配额，超限返回 507（保守估算：进行中声明大小 + 已合并产物）
  # rc.6 端点开关：/upload 由组件 UploadServlet 承载；/download 默认关闭——业务下载走
  # /api/file/download/{token}，不暴露「已合并未确认」临时产物的裸下载面（最小暴露）。
  endpoint:
    enabled: true
    upload-enabled: true
    download-enabled: false
  # rc.6 失败响应体：legacy = 组件端点模型（前端仅消费状态码/文本，兼容）；standard = 统一 UploadHttpError。
  http:
    error-body: legacy
  # rc.6 multipart 策略：component = 以 max-chunk-size/max-request-size 作 Servlet @MultipartConfig
  #（5MB 分片 + 表单开销 < 10MB）；spring = 跟随 spring.servlet.multipart.*；unlimited = 关闭容器上限。
  multipart:
    strategy: component
  async-merge:
    enabled: true
    thread-pool-size: 2
  cleanup:
    enabled: true        # 组件 StorageCleanupService 开关（rc.6 起由 starter 自动装配）
    run-on-startup: true
    interval: 1h
    task-ttl: 24h        # 未完成任务闲置 TTL（与 redis.ttl-seconds 一致）
    orphan-enabled: true # 无任务记录的孤儿分片/合并目录回收
    use-redis-lock: true # rc.6 起生效：RedisCleanupLock 租约锁（多实例仅一个清理者；单实例无副作用）
  observability:
    access-log: false    # 越权审计已由 UploadAccessAuditListener 落库；此开关仅额外输出结构化访问日志
    # rc.8 降噪：access-log=true 时默认 scope=task（deny + 任务级事件，每个任务仅首个分片放行一条）；
    # 需要 rc.7 的逐决策日志设 all，仅 deny 设 deny。access-log=false 时本项无效果。
    access-log-scope: task
  # rc.8 受信读门面：starter 自动装配 TrustedUploadService（@ConditionalOnMissingBean），供 FileService
  # confirm 等可信服务端流程使用；设为 false 可抑制该 Bean（本工程需要，保持默认 true）。
  trusted-upload-service:
    enabled: true
  # rc.7/rc.8 可选能力（默认即当前行为，单实例部署无需改动；PRD 明确非目标多实例）：
  # lock:
  #   identifier-lock: local        # 多实例改 redis（RedisIdentifierLockProvider，SET NX PX 串行化同 identifier）
  #   acquire-timeout: 10s
  #   ttl: 30s
  #   renew-interval: 0s            # rc.8：0 = 按 ttl/3 自动续租（长合并不再因 TTL 到期失效）
  # quota:
  #   store: task-store             # 多实例/高并发改 redis（RedisQuotaStore，Lua 原子 check-and-reserve；
  #                                 # rc.8：启动期自动 reconcile 对齐计数，清理回收已合并未确认任务的配额）
  security:
    enabled: false       # 共享令牌关闭；鉴权 = Spring Security 会话 + UploadOwnerAccessControl（AccessControl Bean 覆盖）

logging:
  level:
    root: info
    cn.chenxinjie.pathfinder: info
