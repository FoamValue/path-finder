spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:pathfinder}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:pathfinder}
    password: ${MYSQL_PASSWORD:pathfinder123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

pathfinder:
  storage:
    root: ${STORAGE_ROOT:/data/storage}
