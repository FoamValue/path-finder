# HTTP-only variant of docker/nginx.conf — no TLS, used without mounting certificates.
# Enable via: docker compose -f docker/docker-compose.yml -f docker/docker-compose.http.yml up -d
server {
    listen 80;
    server_name _;

    client_max_body_size 600m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: /login and other frontend routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite output includes .mjs ES modules (e.g. pdf.js worker); must be served as JS,
    # otherwise the browser's dynamic import() fails ("Failed to fetch dynamically imported module").
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    # Backend API (auth endpoints are all under /api)
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Large-file chunked upload endpoint
    location = /upload {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}